# Pile TerangaCycle AI : un seul fichier, profils `demo` et `prod` (AD-28).
#
# Depuis la racine du dépôt (via compose.yaml) :
#   python infra/gen-dev-secrets.py
#   docker compose --profile demo up -d
#
# Règles :
#   - toute image est référencée par `tag@sha256:` ; api, worker et migrate sont
#     construits depuis backend/Dockerfile, caddy depuis infra/caddy/Dockerfile
#     (images de base épinglées dans ces fichiers) ;
#   - healthchecks sans curl ;
#   - secrets lus dans .env.secrets/ (hors Git) et montés dans /run/secrets/ ;
#   - /metrics et /v1/ai/* de l'API restent sur le réseau Compose : Caddy ne les relaie pas.
# Les chemins relatifs partent du dossier infra/.

# Socle commun des services construits depuis backend/ (même Dockerfile, même image).
x-backend: &backend
  build:
    context: ../backend
  profiles: [demo, prod]
  env_file:
    - path: ../.env
      required: true
  restart: unless-stopped

# Secrets de l'API et du worker : mot de passe de base et inventaire AD-26 complet.
# En ENV=demo ou prod, un secret absent ou vide refuse le démarrage.
x-app-secrets: &app-secrets
  - db_app_password
  - jwt_signing_keys
  - phone_pepper
  - device_id_pepper
  - phone_enc_keys
  - totp_enc_key
  - vapid_private_key
  - s3_access_key_id
  - s3_secret_access_key
  - alert_webhook_url

services:
  # Bord HTTPS : PWA (construite dans l'image) et API sur APP_HOST, photos sur MEDIA_HOST.
  caddy:
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    profiles: [demo, prod]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_HOST: ${APP_HOST:-app.localhost}
      MEDIA_HOST: ${MEDIA_HOST:-media.localhost}
      # Port HTTPS public, pour la redirection HTTP → HTTPS.
      HTTPS_PORT: ${HTTPS_PORT:-443}
      # Seul bucket lisible sur MEDIA_HOST.
      S3_BUCKET: ${S3_BUCKET:-terangacycle-photos}
    healthcheck:
      # Sans curl : wget de busybox (image alpine) sur l'API d'administration de Caddy,
      # qui n'écoute que dans le conteneur (127.0.0.1:2019).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  api:
    <<: *backend
    # Journal d'accès d'uvicorn coupé : il contiendrait chemins et paramètres ; le
    # middleware de l'API écrit sa propre ligne, masquée (route, statut, durée).
    command: ["uvicorn", "--factory", "app.main:create_app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    secrets: *app-secrets
    healthcheck:
      # Vivacité seulement : /healthz ne dépend d'aucun service externe.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    secrets: *app-secrets
    healthcheck:
      # Battement worker:heartbeat de moins de 60 s dans Valkey.
      test: ["CMD", "python", "-m", "app.worker", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  # Service à usage unique : `alembic upgrade head` avec le rôle teranga_migrator.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    secrets:
      - db_migrator_password
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL 16 + PostGIS (amd64 seulement). Port publié sur 127.0.0.1 seulement,
  # jamais sur une interface publique, pour les tests d'intégration locaux.
  db:
    image: postgis/postgis:16-3.7@sha256:2412104d3a48ad3b76adfa60a71638c93727dcbb49dd5a9207e4e83ab3591716
    profiles: [demo, prod]
    environment:
      POSTGRES_DB: ${DB_NAME:-terangacycle}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - db_migrator_password
      - db_app_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/initdb/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-5432}:5432"
    healthcheck:
      # En TCP : le serveur temporaire de l'initialisation n'écoute que sur le socket
      # local, la base n'est donc saine qu'une fois les scripts initdb terminés.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Valkey en AOF (AD-20) : OTP, limites de débit, file arq.
  valkey:
    image: valkey/valkey:9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
    profiles: [demo, prod]
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Stockage objet S3, un seul nœud, bucket par défaut (AD-13).
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    profiles: [demo, prod]
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-terangacycle-photos}
    # L'image ne lit la clé S3 par défaut que dans l'environnement
    # (GARAGE_DEFAULT_ACCESS_KEY, GARAGE_DEFAULT_SECRET_KEY) : fichier généré, hors Git.
    env_file:
      - path: ../.env.secrets/garage.env
        required: true
    secrets:
      - garage_rpc_secret
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

secrets:
  postgres_password:
    file: ../.env.secrets/postgres_password
  db_migrator_password:
    file: ../.env.secrets/db_migrator_password
  db_app_password:
    file: ../.env.secrets/db_app_password
  garage_rpc_secret:
    file: ../.env.secrets/garage_rpc_secret
  # Inventaire AD-26 (python infra/gen-dev-secrets.py).
  jwt_signing_keys:
    file: ../.env.secrets/jwt_signing_keys
  phone_pepper:
    file: ../.env.secrets/phone_pepper
  device_id_pepper:
    file: ../.env.secrets/device_id_pepper
  phone_enc_keys:
    file: ../.env.secrets/phone_enc_keys
  totp_enc_key:
    file: ../.env.secrets/totp_enc_key
  vapid_private_key:
    file: ../.env.secrets/vapid_private_key
  s3_access_key_id:
    file: ../.env.secrets/s3_access_key_id
  s3_secret_access_key:
    file: ../.env.secrets/s3_secret_access_key
  alert_webhook_url:
    file: ../.env.secrets/alert_webhook_url

volumes:
  db-data:
  valkey-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
