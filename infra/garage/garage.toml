# Configuration Garage à un seul nœud (démonstration et développement).
# Aucun secret ici : le secret RPC est lu dans /run/secrets/ (secrets Compose).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# Un seul nœud : pas de réplication.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/garage_rpc_secret"
# Les secrets Compose montés depuis l'hôte (Windows, macOS) sont lisibles par tous :
# Garage les refuserait sans cette option.
allow_world_readable_secrets = true

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
